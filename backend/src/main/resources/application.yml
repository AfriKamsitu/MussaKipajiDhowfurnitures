server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pajedhowfurnitures

  datasource:
    url: jdbc:mysql://localhost:3306/pajedhowfurnitures?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 0987654321
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

# Application-specific settings
app:
  jwt:
    # Base64-encoded 256-bit secret. Override in production.
    secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    access-token-expiration-ms: 86400000      # 24 hours
    refresh-token-expiration-ms: 604800000    # 7 days
    issuer: pajedhow-backend

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:3001
      - https://your-nextjs-app.vercel.app

  seed:
    enabled: true

  whatsapp:
    phone: 255700000000

logging:
  level:
    org.springframework.security: INFO
    com.pajedhow: DEBUG