server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 6MB
    max-swallow-size: 6MB

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: pajedhowfurnitures

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pajedhowfurnitures?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

# Application-specific settings
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: pajedhow-backend

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    sync-password: ${ADMIN_SYNC_PASSWORD:false}

  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    facebook-app-id: ${FACEBOOK_APP_ID:}
    facebook-app-secret: ${FACEBOOK_APP_SECRET:}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001}

  whatsapp:
    phone: 255700000000

logging:
  level:
    org.springframework.security: INFO
    com.pajedhow: INFO
